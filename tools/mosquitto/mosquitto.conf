# Local Mosquitto broker: offline backup for the demo.
# Create the password file first (it is git-ignored):
#   mosquitto_passwd -c tools/mosquitto/passwd srf-device
#   mosquitto_passwd tools/mosquitto/passwd srf-web
# Run from the repo root:
#   mosquitto -c tools/mosquitto/mosquitto.conf -v
# On Windows, allow ports 1883 and 9001 through the firewall for the private network.

per_listener_settings false
allow_anonymous false
password_file tools/mosquitto/passwd

# Device (plain MQTT; enter TLS = 0 in the device's setup portal)
listener 1883
protocol mqtt

# Website (ws:// works only from the local dev server or presentation.html, not from https)
listener 9001
protocol websockets

persistence false
log_type error
log_type warning
log_type notice
