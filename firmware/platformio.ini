; Smart Rice Farm firmware. Every platform and library version is pinned.
; Board: ESP32-S3 (QFN56 rev v0.2), 16 MB QIO flash, 8 MB embedded octal PSRAM (~N16R8).

[platformio]
default_envs = esp32s3

[env]
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:esp32s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM4
monitor_port = COM4
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@2.36.18
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
  knolleary/PubSubClient@2.8
  tzapu/WiFiManager@2.0.17
test_ignore = *

; PC unit tests for the pure C++ core: pio test -e native
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
  ${env.lib_deps}
  throwtheswitch/Unity@2.6.1
