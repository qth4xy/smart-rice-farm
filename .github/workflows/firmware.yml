name: firmware

on:
  push:
    paths: ['firmware/**', 'shared/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'shared/**', '.github/workflows/firmware.yml']

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Native unit tests (shared AWD test vectors)
        run: pio test -e native
      - name: Build ESP32-S3 firmware
        run: pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware/.pio/build/esp32s3/firmware.bin
